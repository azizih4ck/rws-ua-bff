name: Mirror Deloitte GitHub Tag to RWS GitHub

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to mirror (leave blank if running automatically on a tag push)'
        required: false
        default: ''

jobs:
  push-tag-to-rws:

    name: Push Tag to RWS
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Deloitte repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure SSH for RWS
        env:
          RWS_DEPLOY_KEY: ${{ secrets.RWS_DEPLOY_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "$RWS_DEPLOY_KEY" > ~/.ssh/rws_deploy_key
          chmod 600 ~/.ssh/rws_deploy_key

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          git config core.sshCommand \
            "ssh -i ~/.ssh/rws_deploy_key -o IdentitiesOnly=yes"

          git remote add rws \
            git@github.com:azizih4ck/rws-ua-bff.git

      - name: Push tag to RWS
        env:
          # Uses the manual input tag if provided; otherwise falls back to the event context tag name
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -e

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Tag name could not be determined."
            exit 1
          fi

          echo "========================================"
          echo "Deloitte → RWS Tag Synchronization"
          echo "========================================"
          echo "Repository : ${{ github.repository }}"
          echo "Tag        : $TAG_NAME"
          echo "========================================"

          # Fetch the specific tag locally to ensure it is present if triggered manually from a branch
          git fetch origin refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME} --tags || true

          git push rws \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

          echo "Tag $TAG_NAME successfully pushed to RWS."

      - name: Verify RWS tag
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -e

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Tag name missing for verification."
            exit 1
          fi

          SOURCE_SHA=$(git rev-list -n 1 "$TAG_NAME")

          RWS_SHA=$(git ls-remote \
            rws \
            "refs/tags/${TAG_NAME}" | cut -f1)

          echo "========================================"
          echo "Tag Verification"
          echo "========================================"
          echo "Tag          : $TAG_NAME"
          echo "Deloitte SHA : $SOURCE_SHA"
          echo "RWS SHA      : $RWS_SHA"
          echo "========================================"

          if [ "$SOURCE_SHA" != "$RWS_SHA" ]; then
            echo "::error::RWS tag SHA does not match Deloitte tag SHA."
            exit 1
          fi

          echo "Verification successful."
