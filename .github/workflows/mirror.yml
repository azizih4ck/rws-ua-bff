name: Mirror Deloitte GitHub to RWS GitHub

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

  delete:

  workflow_dispatch:

jobs:
  mirror-to-rws:
    name: Mirror Repository to RWS
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Deloitte repository
      - name: Checkout Deloitte repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-sync-bot"
          git config user.email "github-sync-bot@users.noreply.github.com"

      # 3. Configure RWS GitHub remote
      - name: Configure RWS GitHub remote
        env:
          RWS_GITHUB_USERNAME: ${{ secrets.RWS_GITHUB_USERNAME }}
          RWS_GITHUB_TOKEN: ${{ secrets.RWS_GITHUB_TOKEN }}
        run: |
          git remote add rws \
            "https://github.com/azizih4ck/rws-mirror-test.git"

          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:%s' "$RWS_GITHUB_USERNAME" "$RWS_GITHUB_TOKEN" | base64 -w 0)"

      # 4. Sync all branches
      - name: Sync branches
        run: |
          git push rws --all

      # 5. Sync all tags
      - name: Sync tags
        run: |
          git push rws --tags

      # 6. Verify main commit SHA
      - name: Verify commit SHA match
        run: |
          set -e

          SOURCE_SHA=$(git rev-parse refs/remotes/origin/main)
          RWS_SHA=$(git ls-remote rws refs/heads/main | cut -f1)

          echo "Source SHA: $SOURCE_SHA"
          echo "RWS SHA:    $RWS_SHA"

          if [ "$SOURCE_SHA" != "$RWS_SHA" ]; then
            echo "::error::SHA mismatch — RWS main does not match source main"
            exit 1
          fi

          echo "Verified: RWS main matches Deloitte main"
